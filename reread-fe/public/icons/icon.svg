<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Warm Espresso Leather Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2518" />
      <stop offset="50%" stop-color="#2B1A10" />
      <stop offset="100%" stop-color="#1B0F08" />
    </linearGradient>

    <!-- Warm Sepia Book Paper Gradient -->
    <linearGradient id="pageLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EADBBE" />
      <stop offset="30%" stop-color="#F7EFE1" />
      <stop offset="100%" stop-color="#FFFCF5" />
    </linearGradient>
    
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EADBBE" />
      <stop offset="30%" stop-color="#F7EFE1" />
      <stop offset="100%" stop-color="#FFFCF5" />
    </linearGradient>

    <!-- Warm Amber Bookmark Ribbon -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#684A33" stroke-width="4" stroke-opacity="0.35" />

  <!-- Minimalist Elegant Open Book -->
  <g transform="translate(0, 8)" filter="url(#softShadow)">
    <!-- Left Open Page -->
    <path d="M 246 148 C 180 126, 110 134, 88 152 C 84 155, 82 160, 82 166 L 82 368 C 82 374, 86 379, 92 379 C 114 363, 180 353, 246 375 Z" 
          fill="url(#pageLeft)" />
    
    <!-- Right Open Page -->
    <path d="M 266 148 C 332 126, 402 134, 424 152 C 428 155, 430 160, 430 166 L 430 368 C 430 374, 426 379, 420 379 C 398 363, 332 353, 266 375 Z" 
          fill="url(#pageRight)" />

    <!-- Center Spine Shadow & Stitching -->
    <path d="M 256 150 L 256 384" stroke="#B8976C" stroke-width="5" stroke-linecap="round" />
    <path d="M 256 150 L 256 384" stroke="#785328" stroke-width="1.5" stroke-linecap="round" />

    <!-- Bookmark Ribbon Hanging from Top Center -->
    <path d="M 246 140 L 266 140 L 266 235 L 256 222 L 246 235 Z" 
          fill="url(#ribbonGrad)" />
  </g>
</svg>
