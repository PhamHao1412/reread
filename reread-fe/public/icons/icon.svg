<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0D1C" />
      <stop offset="50%" stop-color="#2D124D" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Open Book Pages Left & Right -->
  <g transform="translate(0, 10)">
    <!-- Left Page -->
    <path d="M 240 140 C 180 120, 100 130, 80 150 L 80 370 C 100 350, 180 340, 240 360 Z" 
          fill="url(#pageGrad)" fill-opacity="0.95" />
    
    <!-- Right Page -->
    <path d="M 272 140 C 332 120, 412 130, 432 150 L 432 370 C 412 350, 332 340, 272 360 Z" 
          fill="url(#pageGrad)" fill-opacity="0.95" />

    <!-- Center Spine Spine Glow -->
    <path d="M 256 140 L 256 365" stroke="#9333EA" stroke-width="6" stroke-linecap="round" />

    <!-- Speed Reading Lightning Bolt / Energy Glyph -->
    <path d="M 275 90 L 210 245 L 265 245 L 235 410 L 320 225 L 265 225 Z" 
          fill="url(#goldGrad)" filter="url(#glow)" stroke="#B45309" stroke-width="3" stroke-linejoin="round" />
  </g>
</svg>
